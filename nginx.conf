worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log off;
    error_log  /dev/stderr warn;

    # Define the "upstream" servers
    upstream nextjs_upstream {
        server frontend:3000;
    }

    upstream backend_upstream {
        server backend:8000;
    }

    server {
        listen 8080;
        server_name localhost;

        # Security headers (frame-deny, nosniff, referrer-policy, CSP) are
        # deliberately emitted by the backend and frontend applications, not by
        # this proxy: each response class then has exactly one source of truth,
        # and the headers still apply in deployments where no proxy sits in
        # front of the apps at all. Do not add them here.

        # Proxy API calls to the backend (path /api/... is preserved and
        # forwarded as-is, matching the backend's /api route prefix).
        location /api/ {
            proxy_pass http://backend_upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://nextjs_upstream;

            # These headers pass the user's real IP address and info through Nginx to Next.js
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Cache Next.js static assets
        location /_next/static/ {
            proxy_pass http://nextjs_upstream;
            proxy_cache_valid 60m;
            expires 1y;
            access_log off;
        }
    }
}