apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: guardianway
spec:
  replicas: 1
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: ${BACKEND_IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef: { name: gw-secrets }
          readinessProbe:
            httpGet: { path: /readyz, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          # Liveness must NOT check dependencies: it restarts the pod, so a database
          # blip would restart every replica at once. It only asks "is this process
          # wedged?". Slower period and later start than readiness on purpose.
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: guardianway
spec:
  selector: { app: backend }
  ports:
    - port: 8000
      targetPort: 8000
